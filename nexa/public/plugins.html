<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#10b981" />
    <link rel="icon" href="/img/nexa-logo.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
