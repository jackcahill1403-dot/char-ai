# Atlas — default Render deploy for this repo (zynx-classic). char.ai uses render-char-ai.yaml.
services:
  - type: web
    name: atlas
    runtime: node
    plan: free
    rootDir: zynx-classic
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: keys
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: OPENROUTER_APP_TITLE
        value: Atlas
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_PER_DAY
        value: "50"
