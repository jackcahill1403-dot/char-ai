<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atlas — AI chat with OpenRouter models" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link rel="icon" href="/img/atlas-logo.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/img/atlas-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Atlas — Agents</title>
    <link rel="stylesheet" href="/css/style.css?v=13" />
  </head>
  <body class="app-page">
    <header class="app-header">
      <a href="/" class="brand-mark" aria-label="Atlas home">
        <img src="/img/atlas-logo.png" alt="" width="28" height="28" class="brand-logo" />
        <span class="brand-name">Atlas</span>
      </a>
      <nav class="app-nav" aria-label="Main">
        <a href="/">Chat</a>
        <a href="/agents.html" aria-current="page">Agents</a>
        <a href="/plugins.html">Plugins</a>
        <a href="/scripts.html">Scripts</a>
        <a href="/settings.html">Settings</a>
        <a href="/status.html">Status</a>
      </nav>
    </header>

    <div id="global-usage-bar" class="usage-bar usage-bar--slim">
      <span class="usage-bar-label">Quota</span>
      <div class="usage-bar-track"><div id="global-usage-bar-fill" class="usage-bar-fill"></div></div>
      <span id="global-usage-bar-text" class="usage-bar-text">Loading…</span>
    </div>

    <main>
      <div id="error" class="error-banner" role="alert"></div>
      <div id="success" class="success-banner" role="status"></div>

      <section class="card">
        <h2>Agent pipeline</h2>
        <p class="hint">
          <strong>1 message total</strong> — Qwen 3.6 (plan) → Kimi 2.7 + GLM 5.2 (code, parallel) → GPT-OSS + Kimi 2.6 (test, parallel).
        </p>
        <label class="toggle-row">
          <input type="checkbox" id="agents-enabled" checked />
          Use agent pipeline (when off, single model from Settings runs)
        </label>
      </section>

      <section class="card">
        <h2>Presets</h2>
        <p class="hint">One-click dev team setups.</p>
        <div id="preset-list" class="preset-row"></div>
      </section>

      <section class="card">
        <h2>Your agents</h2>
        <div id="agent-list" class="agent-list"></div>
        <div class="card-actions">
          <button type="button" id="add-agent-btn" class="btn-secondary">Add agent</button>
        </div>
      </section>

      <div class="page-actions">
        <button type="button" id="save-btn" class="btn">Save agents</button>
      </div>
    </main>

    <script src="/js/app.js" defer></script>
    <script src="/js/api.js"></script>
    <script src="/js/motion.js"></script>
    <script src="/js/usage-bar.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/agents.js"></script>
  </body>
</html>
