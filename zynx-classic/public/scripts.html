<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atlas — AI chat with OpenRouter models" />
    <meta name="theme-color" content="#f67e31" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link rel="icon" href="/img/atlas-logo.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/img/atlas-logo.png" />
    <title>Atlas — Scripts</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <a href="/" class="brand-mark" aria-label="Atlas home">
        <img src="/img/atlas-logo.png" alt="" width="36" height="36" class="brand-logo" />
        <span class="brand-name">Atlas</span>
      </a>
      <nav>
        <a href="/">Chat</a>
        <a href="/agents.html">Agents</a>
        <a href="/plugins.html">Plugins</a>
        <a href="/scripts.html" aria-current="page">Scripts</a>
        <a href="/settings.html">Settings</a>
        <a href="/status.html">Status</a>
      </nav>
    </header>

    <div id="global-usage-bar" class="usage-bar">
      <span class="usage-bar-label">Model limit</span>
      <div class="usage-bar-track"><div id="global-usage-bar-fill" class="usage-bar-fill"></div></div>
      <span id="global-usage-bar-text" class="usage-bar-text">Loading…</span>
    </div>

    <main>
      <div id="error" class="error-banner" role="alert"></div>
      <div id="success" class="success-banner" role="status"></div>

      <section class="card">
        <h2>Friend feed</h2>
        <p class="hint">Recently published global scripts from everyone on this server.</p>
        <div id="feed-list"></div>
      </section>

      <section class="card">
        <h2>Save new script</h2>
        <label>Name <input type="text" id="script-name" maxlength="60" placeholder="my-backup-script" /></label>
        <label>Folder <input type="text" id="script-folder" maxlength="40" placeholder="default" /></label>
        <label>Tags <input type="text" id="script-tags" placeholder="python, backup" /></label>
        <label>Content <textarea id="script-content" rows="8" placeholder="Paste code or text…"></textarea></label>
        <div class="card-actions">
          <button type="button" id="save-script-btn" class="btn">Save locally</button>
        </div>
      </section>

      <section class="card">
        <h2>Your scripts</h2>
        <label>Filter folder
          <select id="folder-filter"><option value="">All folders</option></select>
        </label>
        <div id="local-list" class="script-list"></div>
      </section>

      <section class="card">
        <h2>Global scripts</h2>
        <div id="global-list" class="script-list"></div>
      </section>
    </main>

    <script src="/js/app.js" defer></script>
    <script src="/js/api.js"></script>
    <script src="/js/motion.js"></script>
    <script src="/js/usage-bar.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/scripts-page.js"></script>
  </body>
</html>
