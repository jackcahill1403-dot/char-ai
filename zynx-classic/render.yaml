services:
  - type: web
    name: atlas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # OpenRouter keys live in the "keys" environment group (or add directly on the service).
      # Do NOT add empty OPENROUTER_* vars here — they override the group.
      - fromGroup: keys
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: OPENROUTER_APP_TITLE
        value: Atlas
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_PER_DAY
        value: "50"
